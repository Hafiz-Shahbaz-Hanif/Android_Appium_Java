name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Fast feedback: the framework always compiles.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile
        run: ./mvnw -B test-compile

  # Full run on an Android emulator (slower; runs on demand or on main).
  emulator:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        api-level: [33]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node (for Appium)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Appium + UiAutomator2 driver
        run: |
          npm i -g appium@2
          appium driver install uiautomator2

      - name: Download APKs
        run: bash scripts/fetch-apps.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      # ApiDemos is the verification gate - a stable, versioned sample app.
      - name: Run ApiDemos suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_5
          script: ./mvnw -B test -Papidemos

      # Wikipedia ships a new APK often; keep its result visible but non-blocking.
      - name: Run Wikipedia suite on emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_5
          script: ./mvnw -B test -Pwikipedia

      - name: Upload report + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts-api${{ matrix.api-level }}
          path: |
            target/extent-report
            target/surefire-reports
            target/screenshots
          retention-days: 7
